<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320" role="img" aria-label="Large red Soviet-inspired artistic banner with Umtan's profile picture">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#de0000"/>
      <stop offset="1" stop-color="#9d0000"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="700" cy="150" r="86"/>
    </clipPath>
  </defs>

  <rect width="1400" height="320" rx="18" fill="url(#red)"/>
  <circle cx="700" cy="150" r="92" fill="#ffd84d"/>
  <circle cx="700" cy="150" r="86" fill="#3b0a0a"/>

  <!-- Umtan's GitHub profile picture -->
  <image href="https://github.com/umtan234.png" x="614" y="64" width="172" height="172" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>

  <!-- decorative wheat ears -->
  <g fill="#ffd84d" opacity="0.95">
    <path d="M550 230c-42-30-56-72-51-121l13 4c-3 44 11 76 47 103z"/>
    <path d="M850 230c42-30 56-72 51-121l-13 4c3 44-11 76-47 103z"/>
  </g>

  <text x="700" y="290" fill="#fff2b3" font-family="Georgia, serif" font-size="26" letter-spacing="10" text-anchor="middle">U M T A N</text>
</svg>
